{% load static %}
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Catálogo UNCP{% endblock %} | TecnoCatálogo</title>

    <!-- Íconos (Bootstrap Icons) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- Estilos propios -->
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}" />
  </head>
  <body>
    <header class="encabezado">
      <div class="contenedor encabezado-fila">
        <a href="{% url 'home' %}" class="marca">
          <i class="bi bi-cpu"></i> TecnoCatálogo
        </a>
        <nav class="menu">
          <a
            href="{% url 'home' %}"
            class="{% if request.resolver_match.url_name == 'home' %}activo{% endif %}"
          >
            <i class="bi bi-house-door"></i> Inicio
          </a>
          <a
            href="{% url 'catalogo' %}"
            class="{% if request.resolver_match.url_name == 'catalogo' %}activo{% endif %}"
          >
            <i class="bi bi-grid"></i> Catálogo
          </a>
        </nav>
      </div>
    </header>

    <main class="contenedor contenido">{% block content %}{% endblock %}</main>

    <footer class="pie">
      <div class="contenedor pie-fila">
        <span
          >&copy; {% now "Y" %} IS093A | Django MTV | RAMOS TACZA CAMILDA -
          TORRES AMBROSIO KATHERINE MEDALLY</span
        >
        <span
          ><i class="bi bi-mortarboard"></i> UNCP - Ingeniería de Sistemas</span
        >
      </div>
    </footer>
  </body>
</html>
